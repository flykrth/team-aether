services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdin-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=false
    networks:
      - mdin-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mdin-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mdin-network

networks:
  mdin-network:
    driver: bridge
